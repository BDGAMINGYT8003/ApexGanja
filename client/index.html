<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Apex Girls</title>
    <style>
      /* Critical Theme Styles (Prevents FOUC) */
      html {
        background-color: #0B0C10; /* Default Dark */
        color: #f3f4f6;
        transition: background-color 0.1s;
      }
      html.light {
        background-color: #fcfcfc; /* Default Light */
        color: #1a1a1a;
      }
      body { margin: 0; padding: 0; overflow-x: hidden; }
    </style>
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light'); // Explicitly add light class if needed
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
